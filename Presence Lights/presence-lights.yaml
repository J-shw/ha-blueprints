blueprint:
  name: Presence Lights
  description: >
    <h3><b>💡 Presence Lights Automation</b></h3>
    <h4>Version: 1.0</h4>

    Automatically turns on lights based on motion or presence. Features an occupancy timeout and a dedicated late-night action.

    Best used with integrations such as:
      - Area Occupancy Detection
      - Magic Areas
      - Other Area occupancy based integrations.

  domain: automation
  input:
    motion_sensor:
      name: Motion Sensor
      description: Sensor used to trigger lights on.
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: motion
            - domain: binary_sensor
              device_class: occupancy

    occupancy_sensor:
      name: Occupancy Sensor
      description: Sensor used for falling-edge turning off lights (can be the same as motion sensor).
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: motion
            - domain: binary_sensor
              device_class: occupancy

    time_settings:
      name: "Time Settings"
      icon: mdi:clock-outline
      description: Select the time-related settings for when the automation should run.
      collapsed: true
      input:
        off_timeout:
          name: Turn Off Timeout
          description: Time to wait after occupancy clears before turning off lights.
          default: 5
          selector:
            number:
              min: 0
              max: 60
              unit_of_measurement: minutes
              step: 1

        enable_time_condition:
          name: Enable Start Time Constraint
          default: false
          selector:
            boolean: {}

        start_time:
          name: Start Time
          description: Lights will only turn on after this time (e.g., 20:00:00).
          default: "20:00:00"
          selector:
            time: {}

        end_time:
          name: End Time
          description: Lights will only turn on before this time (e.g., 06:00:00).
          default: "06:00:00"
          selector:
            time: {}

        enable_sun_condition:
          name: Enable Day/Night Constraint
          default: true
          selector:
            boolean: {}

        sun_elevation:
          name: Sun Elevation Threshold
          description: Turn on lights only when sun is below this angle (0 = horizon, negative = night).
          default: 0
          selector:
            number:
              min: -20
              max: 20
              unit_of_measurement: degrees
              step: 1

        night_time_after:
          name: Night Light After Time
          description: If triggered after this time (e.g., 01:00:00), the Night Light action run.
          default: "01:00:00"
          selector:
            time: {}

        night_time_before:
          name: Night Light Before Time
          description: If triggered after this time (e.g., 05:00:00), the Night Light action will NOT run.
          default: "05:00:00"
          selector:
            time: {}

    light_actions:
      name: "Light Actions"
      icon: mdi:lightbulb-outline
      description: Configure which lights to turn on/off
      collapsed: true
      input:
        target_lights:
          name: Lights to turn off
          description: The lights wanted to be turned off once occupancy/motion is lost.
          selector:
            target:
              entity:
                - domain: light

        standard_light_action:
          name: Standard Light On Action
          description: Action to turn on lights normally.
          selector:
            action: {}

        night_light_action:
          name: Night Light Action
          description: Action to turn on lights during late night hours.
          selector:
            action: {}

    presence_settings:
      name: "Presence Settings"
      icon: mdi:account-check-outline
      description: Configure presence detection settings
      collapsed: true
      input:
        people_to_check:
          name: People to Check
          description: Select the people to check for presence before triggering the automation.
          default: {}
          selector:
            target:
              entity:
                - domain: person

variables:
  people_to_check: !input people_to_check
  enable_time_condition: !input enable_time_condition
  enable_sun_condition: !input enable_sun_condition

trigger:
  - platform: state
    entity_id: !input motion_sensor
    to: "on"
    id: motion_on
  - platform: state
    entity_id: !input occupancy_sensor
    from: "on"
    to: "off"
    for:
      minutes: !input off_timeout
    id: occupancy_off

condition: []

action:
  - choose:
      # --- Motion Detected ---
      - conditions:
          - condition: trigger
            id: motion_on

          # Condition 1: Occupancy was off before motion was detected
          - condition: template
            value_template: >-
              {{ trigger.from_state is not none and trigger.from_state.state == 'off' }}

          # Condition 2: Presence check
          - condition: template
            value_template: >-
              {% set target = people_to_check %}
              {% set entity_ids = target.get('entity_id', []) if target is mapping else target %}
              {% set entity_ids = [entity_ids] if entity_ids is string else entity_ids %}
              
              {% if entity_ids == none or entity_ids == [] or entity_ids == [''] %}
                true
              {% else %}
                {{ states.person | selectattr('entity_id', 'in', entity_ids) | selectattr('state', 'eq', 'home') | list | length > 0 }}
              {% endif %}

          # Condition 3: Time condition (if enabled)
          - condition: or
            conditions:
              - condition: template
                value_template: "{{ not enable_time_condition }}"
              - condition: time
                after: !input start_time
                before: !input end_time

          # Condition 4: Sun condition (if enabled)
          - condition: or
            conditions:
              - condition: template
                value_template: "{{ not enable_sun_condition }}"
              - condition: numeric_state
                entity_id: sun.sun
                attribute: elevation
                below: !input sun_elevation
        sequence:
          - choose:
              - conditions:
                  - condition: time
                    after: !input night_time_after
                    before: !input night_time_before
                sequence: !input night_light_action
            default: !input standard_light_action

      # --- Occupancy/Motion Off ---
      - conditions:
          - condition: trigger
            id: occupancy_off
        sequence:
          - action: light.turn_off
            target: !input target_lights